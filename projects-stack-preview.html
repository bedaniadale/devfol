<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stacked Cards Preview</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* Same tokens as site.css so the preview matches the real site. */
:root {
  --bg: #fafaf8; --bg-alt: #f3f3ef; --surface: #fff;
  --ink: #111413; --ink-2: #3b403e; --muted: #6a706d;
  --line: #e4e4de; --line-2: #d4d4cc;
  --accent: #0d7a53; --accent-ink: #fff; --accent-soft: #e5f3ec;
  --font: 'Geist', ui-sans-serif, system-ui, sans-serif;
  --mono: 'Geist Mono', ui-monospace, Menlo, Consolas, monospace;
  --ease: cubic-bezier(.2, .7, .2, 1);
  --card-shadow: 0 1px 2px rgb(17 20 19 / .05), 0 18px 40px -22px rgb(17 20 19 / .3);
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0e1110; --bg-alt: #131716; --surface: #171b1a;
    --ink: #eef0ee; --ink-2: #c3c8c5; --muted: #8d9490;
    --line: #242a28; --line-2: #323936;
    --accent: #3ccf96; --accent-ink: #06140e; --accent-soft: #11261d;
    --card-shadow: 0 1px 2px rgb(0 0 0 / .3), 0 18px 40px -22px rgb(0 0 0 / .7);
    color-scheme: dark;
  }
}
*, *::before, *::after { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 400 16px/1.6 var(--font); -webkit-font-smoothing: antialiased; overflow-x: hidden; }
img { display: block; max-width: 100%; }
h2, h3, p { margin: 0; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
a { color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; border-radius: 6px; }
.wrap { max-width: 784px; margin: 0 auto; padding: 0 clamp(16px, 4vw, 32px); }
.ic { width: 1em; height: 1em; flex: none; }

/* ── preview chrome (not part of the design) ── */
.switch { position: sticky; top: 0; z-index: 50; background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: blur(8px); border-bottom: 1px solid var(--line); }
.switch .wrap { display: flex; gap: 8px; align-items: center; padding-block: 12px; flex-wrap: wrap; }
.switch span { font: 500 12px var(--mono); color: var(--muted); margin-right: 6px; text-transform: uppercase; letter-spacing: .08em; }
.switch button { padding: 6px 14px; border-radius: 999px; border: 1px solid var(--line-2); font-size: 14px; }
.switch button[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.note { margin-top: 10px; font-size: 14px; color: var(--muted); max-width: 62ch; }
.variant[hidden] { display: none; }

/* ── section header (unchanged from site) ── */
section { padding: 64px 0 96px; overflow-x: clip; }
.eyebrow { font: 500 12px var(--mono); letter-spacing: .1em; text-transform: uppercase; color: var(--accent); }
.head h2 { font-size: 34px; letter-spacing: -.03em; line-height: 1.15; margin: 8px 0 12px; }
.head p { color: var(--ink-2); max-width: 56ch; }
.text-link { display: inline-flex; gap: 6px; align-items: center; color: var(--accent); text-decoration: none; font-weight: 500; font-size: 14.5px; }
.text-link:hover { text-decoration: underline; text-underline-offset: 3px; }
.head .text-link { margin-top: 16px; }

/* ════════════════════════════════════════════════════════════════════════
   Shared card. Screenshot-led instead of the old icon + pills: the work is
   the hero, the label is a quiet mono line, the CTA is a link, not a pill.
   ════════════════════════════════════════════════════════════════════════ */
.sc {
  grid-area: 1 / 1; position: relative; width: min(100%, 460px);
  background: var(--surface); border: 1px solid var(--line); border-radius: 18px;
  box-shadow: var(--card-shadow);
  transition: transform .6s var(--ease), opacity .45s var(--ease);
}
.sc-inner { display: flex; flex-direction: column; height: 100%; border-radius: inherit; }
.sc-shot { position: relative; margin: 10px 10px 0; aspect-ratio: 16 / 9; border-radius: 11px; overflow: hidden; background: var(--bg-alt); border: 1px solid var(--line); }
.sc-shot img { width: 100%; height: 100%; object-fit: cover; object-position: top center; transition: transform 1.4s var(--ease); }
.sc:hover .sc-shot img { transform: translateY(-3%); }
.sc-body { flex: 1; display: flex; flex-direction: column; gap: 9px; padding: 16px 22px 18px; }
.sc-kick { display: flex; justify-content: space-between; align-items: center; gap: 12px; font: 500 11.5px var(--mono); letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.sc-kick b { font-weight: 500; color: var(--accent); margin-right: 8px; }
.sc h3 { font-size: 22px; font-weight: 600; letter-spacing: -.025em; line-height: 1.2; }
.sc-desc { font-size: 14.5px; line-height: 1.55; color: var(--ink-2); display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.sc-stack { font: 500 12px/1.5 var(--mono); color: var(--muted); }
.sc-foot { margin-top: auto; padding-top: 14px; border-top: 1px dashed var(--line-2); display: flex; justify-content: space-between; align-items: center; gap: 10px 16px; flex-wrap: wrap; }
.sc-case { display: inline-flex; align-items: center; gap: 8px; font-weight: 600; font-size: 14.5px; text-decoration: none; }
.sc-case .ic { transition: transform .25s var(--ease); }
.sc-case:hover .ic { transform: translateX(3px); }
.sc-url { font: 500 12px var(--mono); color: var(--muted); text-decoration: none; display: inline-flex; gap: 5px; align-items: center; }
.sc-url:hover { color: var(--accent); }
.status { display: inline-flex; align-items: center; gap: 6px; }
.status.live { color: var(--accent); }
.status.live::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor; box-shadow: 0 0 0 3px var(--accent-soft); }
/* Dims cards further back in the stack. */
.sc::after { content: ""; position: absolute; inset: 0; border-radius: inherit; background: var(--bg); opacity: calc(min(var(--k, 0), 3) * .22); pointer-events: none; transition: opacity .45s var(--ease); }

/* ── shared stack controls: counter + segment bar, text arrows ── */
.snav { display: flex; align-items: center; justify-content: space-between; gap: 16px; max-width: 460px; margin: 28px auto 0; }
.snav-b { display: inline-flex; align-items: center; gap: 8px; font: 500 13px var(--mono); text-transform: uppercase; letter-spacing: .06em; color: var(--muted); padding: 8px 0; transition: color .2s; }
.snav-b:hover { color: var(--ink); }
.snav-mid { display: flex; align-items: center; gap: 14px; }
.snav-c { font: 500 13px var(--mono); color: var(--ink); min-width: 52px; }
.snav-c span { color: var(--muted); }
.snav-seg { display: flex; gap: 5px; }
.snav-seg button { width: 22px; height: 18px; position: relative; }
.snav-seg button::before { content: ""; position: absolute; left: 0; right: 0; top: 8px; height: 2px; border-radius: 2px; background: var(--line-2); transition: background .3s, transform .3s var(--ease); }
.snav-seg button[aria-current="true"]::before { background: var(--accent); transform: scaleY(1.6); }

/* ════════════════════════════════════════════════════════════════════════
   D — Pile. Cards stacked straight up behind each other (no fan, no tilt).
   Drag or swipe the top card away and it slides to the bottom of the pile.
   ════════════════════════════════════════════════════════════════════════ */
.pile { display: grid; justify-items: center; padding-top: 70px; margin-top: 24px; touch-action: pan-y; outline: none; }
.pile .sc { transform-origin: 50% 0; transform: translateY(calc(var(--k) * -20px)) scale(calc(1 - var(--k) * .055)); z-index: calc(10 - var(--k)); }
.pile .sc.far { opacity: 0; }
.pile .sc[data-k="0"] { cursor: grab; }
.pile .sc.dragging { transition: none; cursor: grabbing; }
.pile .sc.leave { transform: translate(var(--tx, -118%), 30px) rotate(var(--tr, -9deg)); opacity: 0; z-index: 20; transition: transform .55s var(--ease), opacity .3s .2s; }

/* ════════════════════════════════════════════════════════════════════════
   E — Folders. Wide cards filed like dividers in a drawer; every card keeps a
   labelled tab on top, so you pick a project by its tab.
   ════════════════════════════════════════════════════════════════════════ */
.folders { display: grid; padding-top: 52px; margin-top: 24px; outline: none; }
.folders .sc { width: 100%; border-radius: 0 16px 16px 16px; transform: translateY(calc(var(--k) * -5px)); z-index: calc(10 - var(--k)); }
.folders .sc[data-k="0"] { border-top-left-radius: 0; }
.folders .sc-inner { flex-direction: row; }
.folders .sc-shot { flex: 0 0 46%; aspect-ratio: auto; min-height: 260px; margin: 10px 0 10px 10px; }
.folders .sc.pulled { animation: pull .55s var(--ease); }
@keyframes pull { 35% { transform: translateY(-22px); } }
.tab {
  position: absolute; bottom: calc(100% - 1px); left: calc(var(--i) * 20%); width: calc(20% - 4px);
  height: 36px; padding: 0 12px; display: flex; align-items: center; gap: 6px;
  background: var(--bg-alt); border: 1px solid var(--line); border-bottom: 0; border-radius: 10px 10px 0 0;
  font: 500 11.5px var(--mono); letter-spacing: .04em; text-transform: uppercase; color: var(--muted);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; transition: color .2s, background .2s;
}
.tab b { font-weight: 500; }
.tab:hover { color: var(--ink); }
.sc[data-k="0"] .tab { background: var(--surface); color: var(--ink); }
.sc[data-k="0"] .tab b { color: var(--accent); }
.sc[data-k="0"] .tab::after { content: ""; position: absolute; left: 0; right: 0; bottom: -2px; height: 3px; background: var(--surface); }
@media (max-width: 620px) {
  .folders .sc-inner { flex-direction: column; }
  .folders .sc-shot { flex: none; aspect-ratio: 16 / 9; min-height: 0; margin: 10px 10px 0; }
  .tab span { display: none; }
  .tab { justify-content: center; padding: 0; }
}

/* ════════════════════════════════════════════════════════════════════════
   F — Rolodex. Cards stack downward in 3D; the front card flips up and
   over its top edge to reveal the next one peeking underneath.
   ════════════════════════════════════════════════════════════════════════ */
.rolo { display: grid; justify-items: center; perspective: 1400px; perspective-origin: 50% 110%; padding-bottom: 54px; margin-top: 48px; outline: none; }
.rolo .sc { transform-origin: 50% 100%; transform: translateY(calc(var(--k) * 18px)) scale(calc(1 - var(--k) * .05)) rotateX(calc(var(--k) * -7deg)); z-index: calc(10 - var(--k)); backface-visibility: hidden; }
.rolo .sc.far { opacity: 0; }
.rolo .sc.leave { transform-origin: 50% 0; transform: translateY(-24px) rotateX(82deg); opacity: 0; z-index: 20; transition: transform .6s cubic-bezier(.5, 0, .3, 1), opacity .35s .25s; }

/* ════════════════════════════════════════════════════════════════════════
   G — Hand. Same "front card + tilted neighbours" direction, but the cards
   pivot around one point far below the deck, like a hand of playing cards:
   five visible on an arc, each one lower the further out it sits.
   ════════════════════════════════════════════════════════════════════════ */
.hand { display: grid; justify-items: center; padding: 20px 0 64px; margin-top: 16px; outline: none; touch-action: pan-y; }
.hand .sc {
  width: min(100%, 390px); border-radius: 20px;
  /* Rotate around a pivot far below (--r), but shrink around each card's own
     centre, so outer cards spread wide without sinking. */
  --r: 1400px;
  transform: translateY(var(--r)) rotate(calc(var(--d) * 6deg)) translateY(calc(var(--r) * -1)) scale(calc(1 - var(--ad) * .05));
  z-index: calc(10 - var(--ad));
}
.hand .sc::after { opacity: calc(var(--ad) * .3); }
.hand .sc:not([data-d="0"]) { cursor: pointer; }
.hand .sc:not([data-d="0"]):hover::after { opacity: calc(var(--ad) * .3 - .12); }
.hand .sc[data-d="0"] { box-shadow: 0 2px 4px rgb(17 20 19 / .05), 0 30px 60px -28px rgb(17 20 19 / .35); }
.hc { display: flex; flex-direction: column; gap: 12px; height: 100%; padding: 20px 22px; border-radius: inherit; }
/* Top accent rule instead of filled label pills. */
.hc::before { content: ""; position: absolute; left: 22px; right: 22px; top: 0; height: 3px; border-radius: 0 0 3px 3px; background: var(--accent); opacity: 0; transition: opacity .3s; }
.sc[data-d="0"] .hc::before { opacity: 1; }
.hc-top { display: flex; justify-content: space-between; align-items: center; font: 500 11.5px var(--mono); letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.hc-top b { font-weight: 500; color: var(--accent); }
.hc-id { display: flex; align-items: center; justify-content: space-between; gap: 14px; }
.hc-id h3 { font-size: 22px; font-weight: 600; letter-spacing: -.025em; line-height: 1.2; }
/* Thumbnail on the right, wide and offset-framed, not a square app icon. */
.hc-thumb { flex: none; width: 84px; height: 54px; border-radius: 8px; overflow: hidden; border: 1px solid var(--line); background: var(--bg-alt); box-shadow: 4px 4px 0 var(--accent-soft); }
.hc-thumb img { width: 100%; height: 100%; object-fit: cover; object-position: top left; }
.hc .sc-desc { margin-top: -2px; }
.hc-foot { margin-top: auto; padding-top: 14px; border-top: 1px dashed var(--line-2); display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
.hc-btn { display: inline-flex; align-items: center; gap: 8px; padding: 8px 14px; border-radius: 10px; border: 1px solid var(--ink); font-weight: 500; font-size: 14px; text-decoration: none; transition: background .2s, color .2s; }
.hc-btn:hover { background: var(--ink); color: var(--bg); }
.hand .sc:not([data-d="0"]) .hc-btn { border-color: var(--line-2); }
@media (max-width: 620px) {
  .hand .sc { width: min(84%, 390px); transform: translateY(var(--r)) rotate(calc(var(--d) * 4deg)) translateY(calc(var(--r) * -1)) scale(calc(1 - var(--ad) * .05)); }
  .hand .sc[data-ad="2"] { opacity: 0; }
}

@media (prefers-reduced-motion: reduce) { .sc, .sc::after, .sc-shot img { transition: none !important; animation: none !important; } }
</style>
</head>
<body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="arr" viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="back" viewBox="0 0 24 24"><path d="M19 12H5M11 6l-6 6 6 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="out" viewBox="0 0 24 24"><path d="M7 17 17 7M9 7h8v8" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
</svg>

<div class="switch">
  <div class="wrap">
    <span>Preview</span>
    <button type="button" data-v="hand" aria-pressed="true">G · Hand (fan)</button>
    <button type="button" data-v="pile" aria-pressed="false">D · Pile</button>
    <button type="button" data-v="folders" aria-pressed="false">E · Folders</button>
    <button type="button" data-v="rolo" aria-pressed="false">F · Rolodex</button>
  </div>
</div>

<section>
  <div class="wrap">
    <div class="head">
      <p class="eyebrow">Selected work</p>
      <h2>Projects</h2>
      <p>Flip through a few highlights, or open the full list. Much of my client work is private; I'm happy to walk you through more on a call.</p>
      <a class="text-link" href="#">All projects <svg class="ic"><use href="#arr"/></svg></a>
      <p class="note" id="note"></p>
    </div>

    <div class="variant" data-v="hand"><div class="hand" id="hand" tabindex="0" aria-roledescription="carousel" aria-label="Featured projects"></div><div class="snav" data-for="hand"></div></div>
    <div class="variant" data-v="pile" hidden><div class="pile" id="pile" tabindex="0" aria-roledescription="carousel" aria-label="Featured projects"></div><div class="snav" data-for="pile"></div></div>
    <div class="variant" data-v="folders" hidden><div class="folders" id="folders" tabindex="0" aria-label="Featured projects"></div><div class="snav" data-for="folders"></div></div>
    <div class="variant" data-v="rolo" hidden><div class="rolo" id="rolo" tabindex="0" aria-roledescription="carousel" aria-label="Featured projects"></div><div class="snav" data-for="rolo"></div></div>
  </div>
</section>

<script>
const P = [
  { t: 'HAU IDMO Portal', k: 'University HR portal', live: true, img: 'hauoieidmo', url: 'hau-oie-idmo.com',
    d: 'Employee portal for Holy Angel University, streamlining HR processes and data management.', s: 'Laravel · Tailwind CSS · MySQL · Hostinger' },
  { t: 'Pina CRM', k: 'Real-estate CRM', live: false, img: 'pina', url: '',
    d: 'A custom CRM for a real estate company — manage property listings, client records, and transactions in one place.', s: 'React · Supabase · Vercel' },
  { t: 'PinaAi', k: 'AI agents', live: true, img: 'pinaai', url: 'pina-ai.netlify.app',
    d: 'An AI layer on top of the Pina CRM — ask about bids, leads and deals in plain language, get a daily brief, and let agents act behind an approval gate.', s: 'React · Supabase · Gemini AI · Netlify' },
  { t: 'The Zepatide', k: 'Brand site', live: true, img: 'zepatide', url: 'thezepatide.com',
    d: 'A professional brand site for medical-grade products — clean, trustworthy design that communicates quality.', s: 'React · Supabase · Cloudflare Pages' },
  { t: 'Umbra', k: 'Tutoring platform', live: true, img: 'umbra', url: 'umbra-app.com',
    d: 'A web app connecting students and parents with nearby tutors — find, book, and manage sessions with ease.', s: 'Laravel · Tailwind CSS · MySQL' },
];
const N = P.length;
const pad = i => String(i + 1).padStart(2, '0');

const card = (p, i, withTab) => `
  <article class="sc" style="--i:${i}">
    ${withTab ? `<button type="button" class="tab" data-go="${i}"><b>${pad(i)}</b><span>${p.t}</span></button>` : ''}
    <div class="sc-inner">
      <div class="sc-shot"><img src="works/web/${p.img}.webp" alt="${p.t} screenshot" draggable="false"></div>
      <div class="sc-body">
        <div class="sc-kick"><span><b>${pad(i)}</b>${p.k}</span><span class="status${p.live ? ' live' : ''}">${p.live ? 'Live' : 'Client'}</span></div>
        <h3>${p.t}</h3>
        <p class="sc-desc">${p.d}</p>
        <p class="sc-stack">${p.s}</p>
        <div class="sc-foot">
          <a class="sc-case" href="#">Read case study <svg class="ic"><use href="#arr"/></svg></a>
          ${p.url ? `<a class="sc-url" href="#">${p.url} <svg class="ic"><use href="#out"/></svg></a>` : ''}
        </div>
      </div>
    </div>
  </article>`;

/* One controller drives all three stacks; each variant's CSS decides what
   --k (distance from the front), .far, .leave and .pulled look like. */
const handCard = (p, i) => `
  <article class="sc" style="--i:${i}">
    <div class="sc-inner hc">
      <div class="hc-top"><span><b>${pad(i)}</b> · ${p.k}</span><span class="status${p.live ? ' live' : ''}">${p.live ? 'Live' : 'Client'}</span></div>
      <div class="hc-id"><h3>${p.t}</h3><span class="hc-thumb"><img src="works/web/${p.img}.webp" alt="" draggable="false"></span></div>
      <p class="sc-desc">${p.d}</p>
      <p class="sc-stack">${p.s}</p>
      <div class="hc-foot">
        <a class="hc-btn" href="#">Case study <svg class="ic"><use href="#arr"/></svg></a>
        ${p.url ? `<a class="sc-url" href="#">${p.url} <svg class="ic"><use href="#out"/></svg></a>` : ''}
      </div>
    </div>
  </article>`;

function stack(root, { tabs = false, animated = true, hand = false } = {}) {
  root.innerHTML = P.map((p, i) => hand ? handCard(p, i) : card(p, i, tabs)).join('');
  const cards = [...root.children];
  const nav = document.querySelector(`.snav[data-for="${root.id}"]`);
  nav.innerHTML = `
    <button type="button" class="snav-b" data-d="-1"><svg class="ic"><use href="#back"/></svg>Prev</button>
    <div class="snav-mid"><span class="snav-c"></span><div class="snav-seg">${P.map((_, i) => `<button type="button" data-go="${i}" aria-label="Project ${i + 1}"></button>`).join('')}</div></div>
    <button type="button" class="snav-b" data-d="1">Next<svg class="ic"><use href="#arr"/></svg></button>`;
  let a = 0;

  const render = () => {
    cards.forEach((c, i) => {
      // Hand: signed offset from the front card, wrapping so it's -2..2.
      const d = ((i - a + N + 2) % N) - 2;
      c.dataset.d = d; c.dataset.ad = Math.abs(d);
      c.style.setProperty('--d', d); c.style.setProperty('--ad', Math.abs(d));
      const k = hand ? Math.abs(d) : tabs ? Math.abs(i - a) : (i - a + N) % N;
      c.dataset.k = k;
      c.style.setProperty('--k', Math.min(k, 3));
      c.classList.toggle('far', !hand && k > 2);
      c.querySelector('.sc-inner').inert = k !== 0;
    });
    nav.querySelector('.snav-c').innerHTML = `${pad(a)} <span>/ ${pad(N - 1)}</span>`;
    nav.querySelectorAll('[data-go]').forEach((b, i) => b.setAttribute('aria-current', i === a));
  };

  const go = (to, dir = to > a ? 1 : -1) => {
    to = (to + N) % N;
    if (to === a) return;
    const out = cards[a], inn = cards[to];
    if (!animated) {
      a = to; render();
      inn.classList.remove('pulled'); void inn.offsetWidth; inn.classList.add('pulled');
      return;
    }
    if (dir > 0) {
      // Front card leaves, then quietly reshuffles to the back while hidden.
      out.classList.add('leave');
      a = to; render();
      setTimeout(() => { out.classList.remove('leave'); out.style.removeProperty('--tx'); out.style.removeProperty('--tr'); }, 520);
    } else {
      // Card comes back from where it left: start it in the leave pose.
      inn.style.transition = 'none';
      inn.classList.add('leave');
      void inn.offsetWidth;
      inn.style.transition = '';
      a = to; render();
      requestAnimationFrame(() => inn.classList.remove('leave'));
    }
  };

  nav.addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return;
    b.dataset.d ? go(a + +b.dataset.d, +b.dataset.d) : go(+b.dataset.go);
  });
  root.addEventListener('click', e => {
    const t = e.target.closest('.tab'); if (t) return go(+t.dataset.go);
    const side = hand && e.target.closest('.sc:not([data-d="0"])');
    if (side) go(a + +side.dataset.d, Math.sign(+side.dataset.d));
  });
  root.addEventListener('keydown', e => {
    if (e.key === 'ArrowRight') { e.preventDefault(); go(a + 1, 1); }
    if (e.key === 'ArrowLeft') { e.preventDefault(); go(a - 1, -1); }
  });
  render();
  return { go, cards, get a() { return a; } };
}

stack(document.getElementById('hand'), { hand: true, animated: false });
const pile = stack(document.getElementById('pile'));
stack(document.getElementById('folders'), { tabs: true, animated: false });
stack(document.getElementById('rolo'));

/* Pile: drag the top card sideways; past the threshold it's tossed to the back. */
(() => {
  const root = document.getElementById('pile');
  let x0 = null, dx = 0, el = null;
  root.addEventListener('pointerdown', e => {
    el = e.target.closest('.sc[data-k="0"]');
    if (!el || e.target.closest('a, button')) { el = null; return; }
    x0 = e.clientX; dx = 0; el.classList.add('dragging'); el.setPointerCapture(e.pointerId);
  });
  root.addEventListener('pointermove', e => {
    if (!el) return;
    dx = e.clientX - x0;
    el.style.transform = `translateX(${dx}px) rotate(${dx / 24}deg)`;
  });
  const end = () => {
    if (!el) return;
    el.classList.remove('dragging'); el.style.transform = '';
    if (Math.abs(dx) > 90) {
      el.style.setProperty('--tx', dx < 0 ? '-118%' : '118%');
      el.style.setProperty('--tr', dx < 0 ? '-9deg' : '9deg');
      pile.go(pile.a + 1, 1);
    }
    el = null;
  };
  root.addEventListener('pointerup', end);
  root.addEventListener('pointercancel', end);
})();

/* switcher */
const notes = {
  hand: 'G — Hand: the same front-card-with-tilted-neighbours direction, but fanned like a hand of playing cards on one arc (5 cards, outer ones lower). Click a side card or use Prev/Next.',
  pile: 'D — Pile: cards stacked straight up behind each other, no fan or tilt. Drag/swipe the top card away (or press Next) and it slides to the bottom of the pile.',
  folders: 'E — Folders: wide cards filed like drawer dividers, each with a labelled tab. Click a tab and that card lifts to the front.',
  rolo: 'F — Rolodex: cards stacked in 3D, the next ones peeking underneath. Next flips the front card up and over the top, like a desk calendar page.',
};
const show = v => {
  document.querySelectorAll('.variant').forEach(el => el.hidden = el.dataset.v !== v);
  document.querySelectorAll('.switch button').forEach(b => b.setAttribute('aria-pressed', b.dataset.v === v));
  document.getElementById('note').textContent = notes[v];
};
document.querySelectorAll('.switch button').forEach(b => b.addEventListener('click', () => show(b.dataset.v)));
show('hand');
</script>
